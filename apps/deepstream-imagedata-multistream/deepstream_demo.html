<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Wall · DeepStream</title>
  <style>
    :root{color-scheme:dark;--bg:#05070b;--panel:#0d131c;--line:#243043;--muted:#91a0b4;--blue:#397ff6;--green:#39d6a2;--red:#ff6678}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fb;font-family:Tahoma,Arial,sans-serif}
    header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);background:#080c12}
    h1{margin:0;font-size:18px}.status{color:var(--muted);font-size:12px}
    main{max-width:1800px;margin:auto;padding:18px}.summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .wall{position:relative;aspect-ratio:16/9;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000}
    iframe{width:100%;height:100%;border:0}.badge{position:absolute;top:10px;z-index:2;padding:7px 10px;border-radius:8px;background:#000c;font:700 11px Arial}
    #wall-fps{left:10px;color:#a9c8ff}.encoder{right:10px;color:#8df0cb}
    .tile-grid{position:absolute;inset:0;z-index:3;display:grid;grid-template-columns:repeat(var(--wall-columns,6),1fr);grid-template-rows:repeat(var(--wall-rows,4),1fr);direction:ltr}
    .tile-hit{position:relative;border:1px solid #ffffff35;background:transparent;color:#fff;cursor:pointer}
    .tile-hit:hover{border-color:#6da5ff;box-shadow:inset 0 0 0 2px #397ff688}
    .tile-hit.offline{background:#21070a99;border-color:#ff667888;cursor:not-allowed}
    .tile-label{position:absolute;left:5px;bottom:5px;max-width:calc(100% - 10px);padding:3px 5px;border-radius:4px;background:#000b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 9px Arial}
    .sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px;margin-top:14px}
    .source{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
    .source.offline{border-color:#74343d}.source strong,.source span{display:block}.source span{margin-top:4px;color:var(--muted);font:11px Arial;direction:ltr}
    .events{margin-top:20px}.event-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.event{padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.event img{width:100%;height:180px;object-fit:contain;background:#000;border-radius:7px}
    button{padding:9px 11px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}
    #fullscreen{display:none;position:fixed;inset:0;z-index:50;background:#000;flex-direction:column}
    #fullscreen .player{flex:1;min-height:0}#fullscreen footer{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:#090d13}
  </style>
</head>
<body>
  <header><h1 id="wall-title">دیوار منابع DeepStream</h1><label><input id="overlay-toggle" type="checkbox"> نمایش تشخیص و Track ID</label><div class="status" id="system-status">در حال اتصال…</div></header>
  <main>
    <div class="summary"><strong id="wall-summary">Wall · 1920×1080</strong><span id="online-count">—</span></div>
    <section class="wall">
      <iframe id="wall-player" title="Video Wall" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
      <span class="badge" id="wall-fps">WALL 0.0 FPS</span><span class="badge encoder">1× NVENC</span>
      <div class="tile-grid" id="tile-grid"></div>
    </section>
    <section class="sources" id="sources"></section>
    <section class="events"><h2>Events</h2><div class="event-grid" id="events"></div></section>
  </main>
  <section id="fullscreen">
    <div class="player"><iframe id="fullscreen-player" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
    <footer><div><strong id="fullscreen-title">Fullscreen</strong><div class="status" id="fullscreen-fps">0.0 FPS</div></div><label><input id="fullscreen-overlay" type="checkbox" checked> Overlay</label><button id="close-fullscreen">بستن</button></footer>
  </section>
  <script>
    const state={cameras:[],runtime:new Map(),fullscreenBusy:false};
    const streamUrl=id=>`http://${location.hostname}:8889/${encodeURIComponent(id)}?controls=true&muted=true&autoplay=true&playsInline=true`;
    async function openFullscreen(camera){
      const item=state.runtime.get(camera.camera_id);if(!item?.online||state.fullscreenBusy)return;
      state.fullscreenBusy=true;
      document.getElementById("fullscreen-title").textContent=`${camera.name} · ${item.width}×${item.height}`;
      const view=document.getElementById("fullscreen");view.style.display="flex";
      const player=document.getElementById("fullscreen-player");
      player.src="about:blank";
      document.getElementById("fullscreen-fps").textContent="در حال اتصال زنده…";
      const start=await fetch("/api/fullscreen/open",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({source_id:camera.camera_id,generation:item.generation,overlay_enabled:document.getElementById("fullscreen-overlay").checked})});
      if(!start.ok){view.style.display="none";state.fullscreenBusy=false;throw new Error((await start.json()).error||"Fullscreen stream آماده نشد");}
      const ready=await start.json();
      player.src=`${streamUrl(ready.stream_path)}&session=${Date.now()}`;
      state.fullscreenBusy=false;
    }
    async function closeFullscreen(){
      if(state.fullscreenBusy)return;state.fullscreenBusy=true;
      document.getElementById("fullscreen-player").src="about:blank";
      await fetch("/api/fullscreen/close",{method:"POST"});
      document.getElementById("fullscreen").style.display="none";
      state.fullscreenBusy=false;
    }
    function render(){
      document.getElementById("tile-grid").replaceChildren(...state.cameras.map((camera,index)=>{
        const tile=document.createElement("button");tile.className="tile-hit";tile.dataset.id=camera.camera_id;
        const label=document.createElement("span");label.className="tile-label";label.textContent=`${index+1} · ${camera.camera_id}`;
        tile.append(label);tile.onclick=()=>openFullscreen(camera);return tile;
      }));
      document.getElementById("sources").replaceChildren(...state.cameras.map((camera,index)=>{
        const card=document.createElement("article");card.className="source";card.dataset.id=camera.camera_id;
        const info=document.createElement("div"),title=document.createElement("strong"),detail=document.createElement("span"),button=document.createElement("button");
        title.textContent=`${index+1}. ${camera.name}`;detail.textContent=camera.camera_id;detail.dataset.role="detail";
        button.textContent="Fullscreen";button.onclick=()=>openFullscreen(camera);
        info.append(title,detail);card.append(info,button);return card;
      }));
    }
    function applyRuntime(payload){
      const layout=payload.wall_layout||{rows:4,columns:6,camera_count:state.cameras.length};
      const grid=document.getElementById("tile-grid");
      grid.style.setProperty("--wall-columns",Math.max(1,Number(layout.columns)||1));
      grid.style.setProperty("--wall-rows",Math.max(1,Number(layout.rows)||1));
      document.getElementById("wall-title").textContent=`دیوار ${layout.camera_count||state.cameras.length} منبع DeepStream`;
      document.getElementById("wall-summary").textContent=`Wall ${layout.columns}×${layout.rows} · 1920×1080 · ${Number(payload.wall_fps||0).toFixed(1)} FPS`;
      state.runtime=new Map(payload.sources.map(item=>[item.camera_id,item]));let online=0;
      document.querySelectorAll(".source").forEach(card=>{
        const item=state.runtime.get(card.dataset.id);if(!item)return;if(item.online)online++;
        card.classList.toggle("offline",!item.online);card.querySelector("button").disabled=!item.online;
        const res=item.width&&item.height?`${item.width}×${item.height}`:"NO FRAME";
        card.querySelector('[data-role="detail"]').textContent=`${item.camera_id} · tile ${item.source_index} · gen ${item.generation} · ${res} · ${Number(item.fps).toFixed(1)} FPS`;
      });
      document.querySelectorAll(".tile-hit").forEach(tile=>{
        const item=state.runtime.get(tile.dataset.id);tile.disabled=!item?.online;tile.classList.toggle("offline",!item?.online);
        const label=tile.querySelector(".tile-label");if(item)label.textContent=`${tile.dataset.id} · ${Number(item.fps).toFixed(1)}`;
      });
      document.getElementById("online-count").textContent=`${online}/${state.cameras.length} online`;
      document.getElementById("wall-fps").textContent=`WALL ${Number(payload.wall_fps).toFixed(1)} FPS`;
      document.getElementById("fullscreen-fps").textContent=`${Number(payload.fullscreen?.fps||0).toFixed(1)} FPS · NVENC ${payload.total_nvenc_sessions||1}/2`;
      document.getElementById("system-status").textContent=`${online} NVDEC sources · ${payload.total_nvenc_sessions||1} NVENC`;
    }
    async function refresh(){const response=await fetch("/api/runtime",{cache:"no-store"});applyRuntime(await response.json())}
    async function refreshEvents(){
      const events=await (await fetch("/api/events?limit=24",{cache:"no-store"})).json();
      document.getElementById("events").replaceChildren(...events.map(event=>{
        const card=document.createElement("article");card.className="event";
        const title=document.createElement("strong");title.textContent=`${event.source_id} · Track ${event.track_id}`;
        const meta=document.createElement("p");meta.textContent=`${event.ended_at} · ${event.duration_ms}ms · ${event.status}`;
        card.append(title,meta);
        if(event.snapshot_object_key){const img=document.createElement("img");img.loading="lazy";img.src=`/api/events/${event.event_id}/snapshot`;card.append(img);}
        if(event.video_object_key){const play=document.createElement("a");play.href=`/api/events/${event.event_id}/video`;play.textContent="پخش MP4";play.target="_blank";card.append(play);}
        if(event.status.includes("FAILED")){const retry=document.createElement("button");retry.textContent="Retry";retry.onclick=()=>fetch(`/api/events/${event.event_id}/retry`,{method:"POST"}).then(refreshEvents);card.append(retry);}
        return card;
      }));
    }
    async function setOverlay(enabled){
      await fetch("/api/overlay",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({global_overlay_enabled:enabled})});
    }
    async function boot(){
      const response=await fetch("/api/cameras",{cache:"no-store"});state.cameras=await response.json();render();
      const overlay=await (await fetch("/api/overlay",{cache:"no-store"})).json();
      const toggle=document.getElementById("overlay-toggle");toggle.checked=overlay.global_overlay_enabled;
      toggle.onchange=()=>setOverlay(toggle.checked);
      document.getElementById("wall-player").src=streamUrl("deepstream-mosaic");
      document.getElementById("close-fullscreen").onclick=closeFullscreen;
      document.getElementById("fullscreen-overlay").onchange=event=>fetch("/api/overlay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullscreen_overlay_enabled:event.target.checked})});
      await refresh();await refreshEvents();setInterval(refresh,1000);setInterval(refreshEvents,5000);
    }
    boot().catch(error=>document.getElementById("system-status").textContent=`خطا: ${error.message}`);
  </script>
</body>
</html>
