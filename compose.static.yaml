services:
  deepstream:
    environment:
      # Static-only mode prevents camera_sources.local.json from being loaded,
      # so no RTSP camera address is contacted in this mode.
      BENCHMARK_STATIC_ONLY: "true"
      # uridecodebin + the app's explicit EOS seek loop is stable on this
      # DeepStream build. nvurisrcbin file-loop causes segment-order warnings.
      STATIC_CAMERA_EMULATION: "false"
      STATIC_CAMERA_LIMIT: "12"
      STATIC_CAMERA_SOURCE_COUNT: "12"
      WALL_COLUMNS: "4"
      WALL_ROWS: "3"
      STATIC_CAMERA_PASSTHROUGH: "false"
      # MPEG-4 Part 2 data/2.mp4 does not reliably seek-loop; the next MP4 in
      # the deterministic list replaces it while the camera count stays 24.
      STATIC_CAMERA_EXCLUDE: "2.mp4"
      RTSP_CAMERA_LIMIT: "0"
      RTSP_CAMERA_COPIES: "1"
    command:
      - python3
      - deepstream_low_latency_rtsp_and_file.py
      - --publish-url
      - rtsp://mediamtx:8554/deepstream-mosaic
      - --video-folder
      - /workspace/data
      - --loop-files
      - --transport
      - tcp
      - --rtsp-latency
      - "120"
      - --output-width
      - "1920"
      - --output-height
      - "1080"
      - --mux-width
      - "2944"
      - --mux-height
      - "1664"
      - --bitrate
      - "8000000"
      - --web-port
      - "7070"
