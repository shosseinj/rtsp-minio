services:
  mediamtx:
    image: bluenviron/mediamtx:1.18.2
    restart: unless-stopped
    ports:
      # The containers use mediamtx:8554. Host port 8555 avoids colliding
      # with older DeepStream containers that were started with -p 8554:8554.
      - "8555:8554"
      - "8889:8889"
      # 8189 is already used by another MediaMTX instance on this host.
      - "8190:8190/udp"
    environment:
      # Change this to the server's LAN IP when viewing from another machine.
      MTX_WEBRTCADDITIONALHOSTS: "${WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1}"
      MTX_WEBRTCLOCALUDPADDRESS: ":8190"

  deepstream:
    image: merged-video-ai-router:v10-flat
    gpus: all
    ipc: host
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      RTSP_CAMERA_LIMIT: "8"
      RTSP_CAMERA_COPIES: "3"
      RTSP_SHARED_INGEST: "false"
      STATIC_CAMERA_LIMIT: "0"
      STATIC_CAMERA_SOURCE_COUNT: "0"
      STATIC_CAMERA_EMULATION: "false"
      STATIC_CAMERA_PASSTHROUGH: "false"
      VIDEO_ONLY_MODE: "false"
      VIDEO_STREAM_ON_DEMAND: "true"
      VIDEO_TRANSPORT_BACKEND: "webrtc"
      VIDEO_ENCODER_BACKEND: "nvenc"
      AI_ENABLED: "true"
      AI_STREAM_ENABLED: "true"
      AI_PERSON_DETECTOR_ENABLED: "true"
      AI_PERSON_INPUT_WIDTH: "640"
      AI_PERSON_INPUT_HEIGHT: "640"
      AI_PERSON_BACKEND: "tensorrt"
      AI_TRACKER_ENABLED: "true"
      AI_TRACKER_BACKEND: "nvtracker"
      PERSON_TRACK_END_TIMEOUT_MS: "1500"
      PERSON_TRACK_MAX_CANDIDATES: "8"
      PERSON_TRACK_CANDIDATE_INTERVAL_MS: "500"
      AI_FULL_FRAME_CPU_COPY_ALLOWED: "false"
      REDIS_STREAM_ENABLED: "true"
      MINIO_MEDIA_ENABLED: "true"
      AI_OVERLAY_ENABLED: "false"
      AI_OVERLAY_DEFAULT_ENABLED: "true"
      AI_OVERLAY_SHOW_TRACK_ID: "true"
      AI_OVERLAY_SHOW_CONFIDENCE: "true"
      AI_OVERLAY_SHOW_LABEL: "true"
      EVENT_QUEUE_MAX_SIZE: "1000"
      MEDIA_JOB_QUEUE_MAX_SIZE: "256"
      EVENT_RETENTION_DAYS: "30"
      LOCAL_SPOOL_RETENTION_HOURS: "72"
      JPEG_ENABLED: "false"
      JPEG_PRESENTATION_ENABLED: "false"
      CPU_PRESENTATION_ENABLED: "false"
      MOSAIC_PUBLISH_ENABLED: "true"
      INDIVIDUAL_STREAMS_ENABLED: "false"
      WALL_COLUMNS: "6"
      WALL_ROWS: "4"
      WALL_TARGET_FPS: "12"
      FULLSCREEN_OUTPUT_WIDTH: "2944"
      FULLSCREEN_OUTPUT_HEIGHT: "1664"
      INDIVIDUAL_OUTPUT_WIDTH: "1280"
      INDIVIDUAL_OUTPUT_HEIGHT: "720"
      BENCHMARK_PIPELINE_MODE: "full"
      BENCHMARK_STATIC_ONLY: "false"
    depends_on:
      - mediamtx
    working_dir: /workspace/apps/deepstream-imagedata-multistream
    ports:
      - "7071:7070"
    volumes:
      - .:/workspace
    command:
      - python3
      - deepstream_low_latency_rtsp_and_file.py
      - --publish-url
      - rtsp://mediamtx:8554/deepstream-mosaic
      - --camera-config
      - /workspace/camera_sources.local.json
      - --transport
      - tcp
      - --rtsp-latency
      - "120"
      - --output-width
      - "1920"
      - --output-height
      - "1080"
      - --bitrate
      - "8000000"
      - --web-port
      - "7070"
